name: Update footer links

on:
  push:
    paths:
      - '.github/workflows/update-footer-links.yml'

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Speak Empowered footer links
        run: |
          sed -i 's#https://speakempowered\.netlify\.app/#https://speakempowered.com#g' *.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No footer links needed updating."
            exit 0
          fi
          git add *.html
          git commit -m "Update Speak Empowered footer URL"
          git push
